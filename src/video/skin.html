<media-container
  class="media-skin ew-player"
  data-theme="elsewhere"
  data-preset="video"
>
  <!-- Add a compatible media component here. -->
  <media-poster class="ew-poster"><img alt="" decoding="async" /></media-poster>
  <media-error-dialog>
    <media-dialog-backdrop class="ew-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ew-dialog">
      <media-dialog-title></media-dialog-title>
      <media-dialog-description></media-dialog-description>
      <media-dialog-close class="ew-button"></media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>
  <media-controls>
    <media-controls-backdrop class="ew-scrim"></media-controls-backdrop>
    <media-controls-group class="ew-buffer-group">
      <media-buffering-indicator class="ew-buffer">
        <media-icon family="elsewhere" name="spinner" class="ew-icon"></media-icon>
      </media-buffering-indicator>
    </media-controls-group>
    <media-controls-content class="ew-content">
      <media-tooltip-group>
        <media-controls-group class="ew-top">
          <media-title class="ew-title"></media-title>
          <media-pip-button id="ew-pip" class="ew-button ew-pip">
            <media-icon family="elsewhere" name="pip-enter" class="ew-icon is-enter"></media-icon>
            <media-icon family="elsewhere" name="pip-exit" class="ew-icon is-exit"></media-icon>
          </media-pip-button>
          <media-tooltip trigger="ew-pip" side="top" class="ew-tooltip">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut></media-tooltip-shortcut>
          </media-tooltip>
        </media-controls-group>

        <!-- ═══ CENTER FLOATING 3D GLASS ORB TRANSPORT (Tablet & Mobile) ═══ -->
        <media-controls-group class="ew-center">
          <media-seek-button seconds="-10" id="ew-seek-center--10" class="ew-button ew-skip ew-skip-rewind">
            <media-icon family="elsewhere" name="seek" class="ew-icon backward"></media-icon>
            <span aria-hidden="true" class="ew-skip-num">10</span>
          </media-seek-button>
          <media-tooltip trigger="ew-seek-center--10" side="top" class="ew-tooltip">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut></media-tooltip-shortcut>
          </media-tooltip>

          <media-play-button id="ew-play-center" class="ew-button ew-play">
            <media-icon family="elsewhere" name="play" class="ew-icon is-play"></media-icon>
            <media-icon family="elsewhere" name="pause" class="ew-icon is-pause"></media-icon>
            <media-icon family="elsewhere" name="restart" class="ew-icon is-restart"></media-icon>
          </media-play-button>
          <media-tooltip trigger="ew-play-center" side="top" class="ew-tooltip">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut></media-tooltip-shortcut>
          </media-tooltip>

          <media-seek-button seconds="10" id="ew-seek-center-10" class="ew-button ew-skip ew-skip-forward">
            <media-icon family="elsewhere" name="seek" class="ew-icon"></media-icon>
            <span aria-hidden="true" class="ew-skip-num">10</span>
          </media-seek-button>
          <media-tooltip trigger="ew-seek-center-10" side="top" class="ew-tooltip">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut></media-tooltip-shortcut>
          </media-tooltip>
        </media-controls-group>

        <!-- ═══ BOTTOM FLOATING GLASS PILL DOCK ═══ -->
        <media-controls-group class="ew-dock">
          <!-- Zone 1: Time + Straight Neon Progress Scrubber -->
          <div class="ew-dock-zone ew-zone-timeline">
            <media-time-group class="ew-time">
              <media-time type="current" class="ew-time-current"></media-time>
              <media-time-separator class="ew-time-sep">/</media-time-separator>
              <media-time type="duration" class="ew-time-duration"></media-time>
            </media-time-group>
            <div class="ew-seek-row">
              <media-time-slider class="ew-timeline">
                <media-slider-track class="ew-trail">
                  <media-slider-buffer></media-slider-buffer>
                  <media-slider-fill></media-slider-fill>
                </media-slider-track>
                <media-slider-thumb class="ew-playhead"></media-slider-thumb>
                <media-slider-preview class="ew-preview">
                  <div class="ew-preview-card">
                    <media-slider-thumbnail><img class="ew-thumbnail-image" alt="" /></media-slider-thumbnail>
                    <div>
                      <media-slider-value type="pointer"></media-slider-value>
                      <media-time-slider-chapter-title></media-time-slider-chapter-title>
                    </div>
                  </div>
                </media-slider-preview>
              </media-time-slider>
            </div>
          </div>

          <!-- Divider between Zone 1 and Desktop Transport -->
          <span class="ew-divider desktop-only" aria-hidden="true"></span>

          <!-- Zone 2 (Desktop only): Inline 3D Glass Orbs Transport -->
          <div class="ew-dock-zone ew-zone-transport desktop-only">
            <media-seek-button seconds="-10" id="ew-seek-dock--10" class="ew-button ew-skip ew-skip-rewind">
              <media-icon family="elsewhere" name="seek" class="ew-icon backward"></media-icon>
              <span aria-hidden="true" class="ew-skip-num">10</span>
            </media-seek-button>
            <media-tooltip trigger="ew-seek-dock--10" side="top" class="ew-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut></media-tooltip-shortcut>
            </media-tooltip>

            <media-play-button id="ew-play-dock" class="ew-button ew-play">
              <media-icon family="elsewhere" name="play" class="ew-icon is-play"></media-icon>
              <media-icon family="elsewhere" name="pause" class="ew-icon is-pause"></media-icon>
              <media-icon family="elsewhere" name="restart" class="ew-icon is-restart"></media-icon>
            </media-play-button>
            <media-tooltip trigger="ew-play-dock" side="top" class="ew-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut></media-tooltip-shortcut>
            </media-tooltip>

            <media-seek-button seconds="10" id="ew-seek-dock-10" class="ew-button ew-skip ew-skip-forward">
              <media-icon family="elsewhere" name="seek" class="ew-icon"></media-icon>
              <span aria-hidden="true" class="ew-skip-num">10</span>
            </media-seek-button>
            <media-tooltip trigger="ew-seek-dock-10" side="top" class="ew-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut></media-tooltip-shortcut>
            </media-tooltip>
          </div>

          <!-- Divider before Volume Zone -->
          <span class="ew-divider" aria-hidden="true"></span>

          <!-- Zone 3: Volume Slider -->
          <div class="ew-dock-zone ew-zone-volume">
            <media-mute-button id="ew-mute" class="ew-button ew-mute">
              <media-icon family="elsewhere" name="volume-off" class="ew-icon is-off"></media-icon>
              <media-icon family="elsewhere" name="volume-low" class="ew-icon is-low"></media-icon>
              <media-icon family="elsewhere" name="volume-high" class="ew-icon is-high"></media-icon>
            </media-mute-button>
            <media-tooltip trigger="ew-mute" side="top" class="ew-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut></media-tooltip-shortcut>
            </media-tooltip>
            <media-volume-slider class="ew-volume-slider" thumb-alignment="edge">
              <media-slider-track>
                <media-slider-fill></media-slider-fill>
              </media-slider-track>
              <media-slider-thumb></media-slider-thumb>
            </media-volume-slider>
          </div>

          <!-- Divider before Utilities Zone -->
          <span class="ew-divider" aria-hidden="true"></span>

          <!-- Zone 4: Utilities Cluster (CC, Settings, Fullscreen) -->
          <div class="ew-dock-zone ew-zone-utilities">
            <media-captions-button id="ew-captions" class="ew-captions">
              CC
            </media-captions-button>
            <media-tooltip trigger="ew-captions" side="top" class="ew-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut></media-tooltip-shortcut>
            </media-tooltip>

            <button
              type="button"
              id="ew-settings"
              commandfor="ew-settings-menu"
              class="ew-settings-btn"
              aria-label="Settings"
            >
              <media-icon family="elsewhere" name="gear" class="ew-icon"></media-icon>
            </button>
            <media-tooltip trigger="ew-settings" side="top" class="ew-tooltip">
              <media-text token="menu.settings">Settings</media-text>
            </media-tooltip>

            <media-fullscreen-button id="ew-fullscreen" class="ew-fullscreen-btn">
              <media-icon family="elsewhere" name="fullscreen-enter" class="ew-icon is-enter"></media-icon>
              <media-icon family="elsewhere" name="fullscreen-exit" class="ew-icon is-exit"></media-icon>
            </media-fullscreen-button>
            <media-tooltip trigger="ew-fullscreen" side="top" class="ew-tooltip">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut></media-tooltip-shortcut>
            </media-tooltip>
          </div>

          <!-- Settings Speech-Bubble Popover Anchored to Settings -->
          <media-menu id="ew-settings-menu" class="ew-menu" side="top" align="end">
            <media-menu-content class="ew-menu-content">
              <div class="ew-settings-header">
                <span class="ew-settings-title">Settings</span>
                <button
                  type="button"
                  class="ew-settings-close"
                  commandfor="ew-settings-menu"
                  aria-label="Close Settings"
                >
                  <media-icon family="elsewhere" name="close" class="ew-icon"></media-icon>
                </button>
              </div>

              <!-- Row 1: Speed -->
              <media-menu-item commandfor="ew-speed-panel" class="ew-card-row">
                <div class="ew-card-left">
                  <media-icon family="elsewhere" name="speed" class="ew-icon"></media-icon>
                  <span class="ew-card-title">Speed</span>
                </div>
                <div class="ew-card-right">
                  <span data-part="hint" class="ew-menu-hint">1.00x</span>
                  <media-icon family="elsewhere" name="chevron" class="ew-icon ew-chevron"></media-icon>
                </div>
              </media-menu-item>

              <!-- Row 2: Quality -->
              <media-menu-item commandfor="ew-quality-panel" class="ew-card-row">
                <div class="ew-card-left">
                  <media-icon family="elsewhere" name="monitor" class="ew-icon"></media-icon>
                  <span class="ew-card-title">Quality</span>
                </div>
                <div class="ew-card-right">
                  <span data-part="hint" class="ew-menu-hint">1080p (FHD)</span>
                  <media-icon family="elsewhere" name="chevron" class="ew-icon ew-chevron"></media-icon>
                </div>
              </media-menu-item>

              <!-- Row 3: Captions with synced toggle switch -->
              <div class="ew-card-row ew-captions-card-row">
                <div class="ew-card-left">
                  <span class="ew-mini-cc">CC</span>
                  <span class="ew-card-title">Captions</span>
                </div>
                <div class="ew-card-right">
                  <media-captions-button class="ew-purple-toggle" aria-label="Toggle Captions">
                    <span class="ew-toggle-thumb"></span>
                  </media-captions-button>
                </div>
              </div>
            </media-menu-content>

            <!-- Speed sub-panel -->
            <media-menu-content id="ew-speed-panel" class="ew-menu-content">
              <media-menu-item class="ew-menu-back">
                <media-icon family="elsewhere" name="chevron" class="ew-icon"></media-icon>
                <media-text token="menu.speed">Speed</media-text>
              </media-menu-item>
              <media-menu-separator></media-menu-separator>
              <media-playback-rate-radio-group>
                <template>
                  <media-menu-radio-item class="ew-menu-item">
                    <span data-part="label"></span>
                    <media-menu-item-indicator>
                      <media-icon family="elsewhere" name="check" class="ew-icon"></media-icon>
                    </media-menu-item-indicator>
                  </media-menu-radio-item>
                </template>
              </media-playback-rate-radio-group>
            </media-menu-content>

            <!-- Quality sub-panel -->
            <media-menu-content id="ew-quality-panel" class="ew-menu-content">
              <media-menu-item class="ew-menu-back">
                <media-icon family="elsewhere" name="chevron" class="ew-icon"></media-icon>
                <media-text token="menu.quality">Quality</media-text>
              </media-menu-item>
              <media-menu-separator></media-menu-separator>
              <media-quality-radio-group>
                <template>
                  <media-menu-radio-item class="ew-menu-item">
                    <span data-part="label"></span>
                    <media-menu-item-indicator>
                      <media-icon family="elsewhere" name="check" class="ew-icon"></media-icon>
                    </media-menu-item-indicator>
                  </media-menu-radio-item>
                </template>
              </media-quality-radio-group>
            </media-menu-content>
          </media-menu>
        </media-controls-group>
      </media-tooltip-group>
    </media-controls-content>
  </media-controls>

  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep"></media-hotkey>
  <media-hotkey keys="j" action="seekStep"></media-hotkey>
  <media-hotkey keys="l" action="seekStep"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
  <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
  <media-hotkey keys="i" action="togglePictureInPicture"></media-hotkey>
  <media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>
  <media-hotkey keys="Home" action="seekToPercent" value="0"></media-hotkey>
  <media-hotkey keys="End" action="seekToPercent" value="100"></media-hotkey>
  <media-hotkey keys="&gt;" action="speedUp"></media-hotkey>
  <media-hotkey keys="&lt;" action="speedDown"></media-hotkey>

  <media-gesture type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
  <media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
  <media-gesture type="doubletap" action="seekStep" region="left"></media-gesture>
  <media-gesture type="doubletap" action="toggleFullscreen" region="center"></media-gesture>
  <media-gesture type="doubletap" action="seekStep" region="right"></media-gesture>

  <media-status-announcer class="ew-sr-only"></media-status-announcer>
  <div class="ew-indicators" aria-hidden="true">
    <media-volume-indicator class="ew-status">
      <media-icon family="elsewhere" name="volume-high" class="ew-icon"></media-icon>
      <media-volume-indicator-fill>
        <media-volume-indicator-value></media-volume-indicator-value>
      </media-volume-indicator-fill>
    </media-volume-indicator>
    <media-seek-indicator class="ew-status">
      <media-icon family="elsewhere" name="seek" class="ew-icon"></media-icon>
      <media-seek-indicator-value></media-seek-indicator-value>
    </media-seek-indicator>
    <media-status-indicator
      class="ew-status ew-feedback"
      actions="toggleFullscreen,toggleSubtitles,togglePictureInPicture"
    >
      <media-icon family="elsewhere" name="fullscreen-enter" class="ew-icon ew-feedback-fullscreen"></media-icon>
      <media-icon family="elsewhere" name="fullscreen-exit" class="ew-icon ew-feedback-exit-fullscreen"></media-icon>
      <media-icon family="elsewhere" name="captions-on" class="ew-icon ew-feedback-captions-on"></media-icon>
      <media-icon family="elsewhere" name="captions-off" class="ew-icon ew-feedback-captions-off"></media-icon>
      <media-icon family="elsewhere" name="pip-enter" class="ew-icon ew-feedback-pip"></media-icon>
      <media-icon family="elsewhere" name="pip-exit" class="ew-icon ew-feedback-exit-pip"></media-icon>
    </media-status-indicator>
  </div>
</media-container>
